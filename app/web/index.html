<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meshbot</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="/static/logo.svg" alt="meshbot" width="81" height="40"><span class="dot" id="hdr-dot"></span><b id="hdr-name">meshbot</b><span class="muted" id="hdr-sub"></span></div>
  <nav id="tabs">
    <button data-tab="dashboard">Dashboard</button>
    <button data-tab="live">Live</button>
    <button data-tab="decisions">Decisions</button>
    <button data-tab="playground">Playground</button>
    <button data-tab="prompts">Prompts</button>
    <button data-tab="channels">Channels</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="advanced">Advanced</button>
  </nav>

<main id="main"></main>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-x" id="modal-x">&times;</button><div id="modal-body"></div></div></div>

<script src="/static/app.js"></script>
